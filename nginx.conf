# nginx.conf — OpenClaw Business reverse proxy
# Routes web traffic to the admin dashboard and serves landing pages.
# Proxies /api/credits to the credit-api container.

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile    on;
  tcp_nopush  on;
  gzip        on;
  gzip_types  text/plain text/css application/json application/javascript text/xml;

  # ── Rate limiting ──
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=web:10m rate=60r/m;

  # ── Upstream services ──
  upstream credit_api {
    server credit-api:3100;
    keepalive 8;
  }

  upstream admin_dashboard {
    server admin:3200;
    keepalive 8;
  }

  # ── HTTP → redirect to HTTPS (when TLS is configured) ──
  # Uncomment this block and the HTTPS server below once you have a cert.
  #
  # server {
  #   listen 80;
  #   server_name _;
  #   return 301 https://$host$request_uri;
  # }

  # ── Main server ──
  server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy no-referrer-when-downgrade;

    # ── Admin Dashboard ──
    location /admin/ {
      limit_req zone=web burst=20 nodelay;
      proxy_pass         http://admin_dashboard/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }

    # ── Admin API (direct path for API calls) ──
    location /admin/api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass         http://admin_dashboard/api/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Credit API (internal — restricted to claw-net) ──
    location /credits/ {
      # Only allow internal Docker network (172.16.0.0/12)
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;

      limit_req zone=api burst=20 nodelay;
      proxy_pass         http://credit_api/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Landing page (root) ──
    location / {
      limit_req zone=web burst=30 nodelay;
      root  /usr/share/nginx/html;
      index landing-page.html index.html;
      try_files $uri $uri/ /landing-page.html;
    }

    # ── Health check endpoint ──
    location /health {
      access_log off;
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
    }
  }

  # ── HTTPS server (uncomment when TLS cert is ready) ──
  #
  # server {
  #   listen 443 ssl http2;
  #   server_name yourdomain.com;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #
  #   # ... same location blocks as above ...
  # }
}
